<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles/studash.css">
<body>
<script src="../../theme.js"></script>
<script src="../../ui-kit.js"></script>
<script>
window.addEventListener('error', event => {
  const out = document.createElement('pre'); out.id = 'results';
  out.textContent = JSON.stringify([{ name: 'page execution', ok: false, error: event.message }]);
  document.body.append(out);
});
window.addEventListener('unhandledrejection', event => {
  const out = document.createElement('pre'); out.id = 'results';
  out.textContent = JSON.stringify([{ name: 'page execution', ok: false, error: String(event.reason?.stack || event.reason) }]);
  document.body.append(out);
});
const results = [];
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
function assert(value, message) { if (!value) throw new Error(message); }
async function test(name, run) {
  document.body.dataset.phase = name;
  try { await run(); results.push({ name, ok: true }); }
  catch (error) { results.push({ name, ok: false, error: error.message }); }
}
(async () => {
  document.body.dataset.phase = "fetch";
  const html = await (await fetch('../../newtab.html')).text();
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  for (const id of ['courseHubDialog', 'pinDialog', 'classDialog', 'vuLoginDialog', 'pooyaDialog', 'onboardDialog']) {
    document.body.append(document.importNode(parsed.getElementById(id), true));
  }
  SDUI.enhanceDialogs();
  const script = document.createElement('script');
  script.src = '../../islands/islands.js';
  document.body.append(script);
  await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });
  document.body.dataset.phase = "mounted";
  await wait(250);

  await test('modal morph animates both ways while close state and reopening stay immediate', async () => {
    const dialog = document.getElementById('pinDialog');
    dialog.showModal();
    getComputedStyle(dialog).opacity;
    await wait(30);
    const motion = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (motion) assert(dialog.getAnimations().some(animation => animation.transitionProperty === 'transform'), 'opening morph missing');
    dialog.getAnimations().forEach(animation => animation.finish());
    assert(getComputedStyle(dialog).transform === 'none', 'settled modal changes picker coordinates');
    dialog.close('done');
    assert(!dialog.open && dialog.returnValue === 'done', 'closing delayed native dialog state');
    getComputedStyle(dialog).opacity;
    if (motion) assert(dialog.getAnimations().some(animation => animation.transitionProperty === 'transform'), 'closing morph missing');
    dialog.showModal();
    assert(dialog.open, 'reopening during closing animation failed');
    await wait(260);
    dialog.close();
  });

  await test('modal footer buttons have a visible gap at the current viewport width', () => {
    for (const id of ['pinDialog', 'classDialog', 'vuLoginDialog', 'pooyaDialog']) {
      const dialog = document.getElementById(id);
      dialog.showModal();
      try {
        const footer = dialog.querySelector('.sd-modal__footer');
        const buttons = [...footer.querySelectorAll('button')].filter(el => el.offsetWidth);
        assert(parseFloat(getComputedStyle(footer).columnGap) >= 8, id + ': missing gap');
        assert(footer.scrollWidth <= footer.clientWidth + 1, id + ': footer overflow');
        if (buttons.length > 1) {
          const a = buttons[0].getBoundingClientRect(), b = buttons[1].getBoundingClientRect();
          assert(a.right + 7 <= b.left || b.right + 7 <= a.left || a.bottom + 7 <= b.top || b.bottom + 7 <= a.top, id + ': buttons overlap');
        }
      } finally { dialog.close(); }
    }
  });

  await test('calendar opens inside the modal top layer and selecting a day updates the native input', async () => {
    const dialog = document.getElementById('courseHubDialog');
    dialog.showModal();
    try {
      dialog.getAnimations().forEach(animation => animation.finish());
      const date = dialog.querySelector('#hubTaskDueDate');
      date.value = '2026-11-21';
      await wait(100);
      const host = date.nextElementSibling;
      host.querySelector('button').click();
      await wait(200);
      const popover = dialog.querySelector('.sd-overlay-root [data-slot="date-picker-popover"]');
      assert(popover, 'calendar portal is outside the modal');
      const before = dialog.getBoundingClientRect();
      const box = popover.getBoundingClientRect();
      assert(box.width > 100 && box.height > 100, 'calendar is hidden');
      assert(box.top >= 0 && box.bottom <= innerHeight + 1, 'calendar extends outside viewport');
      assert(box.left >= 0 && box.right <= innerWidth + 1, 'calendar extends outside viewport');
      let changes = 0;
      date.addEventListener('change', () => changes++);
      const day = popover.querySelector('[role="button"][data-rac]:not([aria-disabled="true"]):not([aria-selected="true"])')
        || popover.querySelector('[role="gridcell"]:not([aria-disabled="true"]) [role="button"]');
      assert(day, 'no selectable calendar day');
      day.click();
      await wait(150);
      assert(changes === 1, 'selected date was not committed exactly once');
      assert(/^\d{4}-\d{2}-\d{2}$/.test(date.value), 'date storage is not Gregorian ISO');
      const after = dialog.getBoundingClientRect();
      assert(Math.abs(before.width - after.width) < 1 && Math.abs(before.height - after.height) < 1, 'picker resized the modal');
    } finally { dialog.close(); }
  });

  await test('opening and closing a modal preserves the page width and horizontal position', () => {
    const spacer = document.createElement('div');
    spacer.style.cssText = 'height:3000px;width:80%;margin:auto';
    document.body.prepend(spacer);
    const dialog = document.getElementById('classDialog');
    const before = spacer.getBoundingClientRect();
    dialog.showModal();
    dialog.getAnimations().forEach(animation => animation.finish());
    const during = spacer.getBoundingClientRect();
    assert(Math.abs(before.width - during.width) < 1 && Math.abs(before.left - during.left) < 1, 'page shifted when modal opened');
    dialog.close();
    dialog.getAnimations().forEach(animation => animation.finish());
    const after = spacer.getBoundingClientRect();
    assert(Math.abs(before.width - after.width) < 1 && Math.abs(before.left - after.left) < 1, 'page shifted when modal closed');
    spacer.remove();
  });

  await test('course inputs, selectors and date controls share a common height and equal column widths', () => {
    for (const id of ['classDialog', 'courseHubDialog']) {
      const dialog = document.getElementById(id);
      dialog.showModal();
      try {
        dialog.getAnimations().forEach(animation => animation.finish());
        const selectors = id === 'classDialog'
          ? ['#className', '#classInstructor', '#classUnits + .sd-island .select__trigger', '#classWeekType + .sd-island .select__trigger']
          : ['#hubTaskTitle', '#hubTaskType + .sd-island .select__trigger', '#hubTaskDueDate + .sd-island .date-input-group'];
        const controls = selectors.map(selector => dialog.querySelector(selector));
        assert(controls.every(Boolean), 'visible course control missing');
        for (const control of controls) {
          const value = control.querySelector('.select__value');
          if (value) {
            const a = control.getBoundingClientRect(), b = value.getBoundingClientRect();
            assert(Math.abs(a.top + a.height / 2 - b.top - b.height / 2) < 1, id + ': select text is vertically misaligned');
          }
        }
        const boxes = controls.map(control => control.getBoundingClientRect());
        assert(boxes.every(box => Math.abs(box.height - 42) < 1), id + ': control heights differ ' + boxes.map(box => box.height));
        if (id === 'classDialog') assert(Math.abs(boxes[0].width - boxes[1].width) < 1, id + ': field widths differ');
        else assert(Math.abs(boxes[1].width - boxes[2].width) < 1, id + ': type and date widths differ ' + boxes.map(box => box.width).join(','));
        for (const row of dialog.querySelectorAll('.form-row')) {
          if (row.getBoundingClientRect().height) assert(row.scrollWidth <= row.clientWidth + 1, id + ': field row overflow');
        }
      } finally { dialog.close(); dialog.getAnimations().forEach(animation => animation.finish()); }
    }
  });

  await test('course navigation has two items per row with space before the exam form', () => {
    const dialog = document.getElementById('courseHubDialog');
    dialog.showModal();
    try {
      dialog.getAnimations().forEach(animation => animation.finish());
      const nav = dialog.querySelector('.course-hub-nav');
      const tabs = [...nav.querySelectorAll('.hub-tab-btn')];
      const boxes = tabs.map(tab => tab.getBoundingClientRect());
      assert(Math.abs(boxes[0].top - boxes[1].top) < 1, 'first row does not have two items');
      assert(Math.abs(boxes[2].top - boxes[3].top) < 1 && boxes[2].top >= boxes[0].bottom + 7, 'second row is crowded');
      assert(nav.getBoundingClientRect().bottom >= boxes[4].bottom + 11, 'tabs touch the bottom border');
      dialog.querySelector('#tabContentTasks').classList.remove('active');
      const exams = dialog.querySelector('#tabContentExams');
      exams.classList.add('active');
      for (const row of exams.querySelectorAll('.form-row')) {
        assert(row.scrollWidth <= row.clientWidth + 1, 'exam form row overflows');
      }
      const controls = [...exams.querySelectorAll('input:not(.sd-native-hidden), .select__trigger, .date-input-group')]
        .filter(control => control.getBoundingClientRect().height);
      assert(controls.length >= 5, 'exam controls missing');
      assert(controls.every(control => Math.abs(control.getBoundingClientRect().height - 42) < 1), 'exam control heights differ');
      const form = exams.querySelector('form');
      assert(form.getBoundingClientRect().top >= nav.getBoundingClientRect().bottom + 19, 'exam form touches navigation');
      const trigger = exams.querySelector('#hubExamTime + .sd-island .select__trigger');
      const value = trigger.querySelector('.select__value');
      assert(value.textContent.includes('بدون ساعت مشخص'), 'no-time label missing');
      const triggerBox = trigger.getBoundingClientRect();
      const valueBox = value.getBoundingClientRect();
      assert(Math.abs(triggerBox.top + triggerBox.height / 2 - valueBox.top - valueBox.height / 2) < 1, 'no-time label is above center');
      const syllabus = exams.querySelector('#hubExamSyllabus');
      assert(syllabus.closest('.form-row').nextElementSibling.classList.contains('hub-form-actions'), 'exam submit crowds the syllabus');
    } finally {
      dialog.querySelector('#tabContentExams').classList.remove('active');
      dialog.querySelector('#tabContentTasks').classList.add('active');
      dialog.close();
    }
  });

  await test('welcome features appear in a two-by-two grid', () => {
    const dialog = document.getElementById('onboardDialog');
    dialog.showModal();
    try {
      dialog.getAnimations().forEach(animation => animation.finish());
      const features = [...dialog.querySelectorAll('.onboard-feat-item')].map(item => item.getBoundingClientRect());
      assert(features.length === 4, 'welcome features missing');
      assert(Math.abs(features[0].top - features[1].top) < 1, 'welcome first row is not two columns');
      assert(Math.abs(features[2].top - features[3].top) < 1 && features[2].top > features[0].bottom, 'welcome second row is crowded');
      const grid = dialog.querySelector('.onboard-features');
      assert(grid.scrollWidth <= grid.clientWidth + 1, 'welcome cards overflow');
    } finally { dialog.close(); }
  });

  await test('notification, tools and weather menus animate both opening and dismissal', async () => {
    for (const selector of ['.notif-dropdown-menu', '.quick-tools-menu', '.weather-popover']) {
      const menu = document.importNode(parsed.querySelector(selector), true);
      document.body.append(menu);
      try {
        menu.hidden = true;
        getComputedStyle(menu).display;
        menu.hidden = false;
        getComputedStyle(menu).opacity;
        await wait(30);
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          assert(menu.getAnimations().some(animation => animation.transitionProperty === 'scale'), selector + ': opening animation missing');
        }
        menu.getAnimations().forEach(animation => animation.finish());
        menu.hidden = true;
        getComputedStyle(menu).opacity;
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          assert(menu.getAnimations().some(animation => animation.transitionProperty === 'scale'), selector + ': closing animation missing');
        }
        menu.getAnimations().forEach(animation => animation.finish());
        assert(getComputedStyle(menu).display === 'none', selector + ': closed menu still visible');
      } finally { menu.remove(); }
    }
  });

  await test('a dropdown in the modal uses the same top-layer overlay container', async () => {
    const dialog = document.getElementById('classDialog');
    dialog.showModal();
    try {
      const trigger = dialog.querySelector('.sd-island--select button');
      assert(trigger, 'select bridge missing');
      trigger.click();
      await wait(150);
      assert(dialog.querySelector('.sd-overlay-root [role="listbox"]'), 'dropdown outside modal');
    } finally { dialog.close(); }
  });
  const output = document.createElement('pre');
  output.id = 'results'; output.textContent = JSON.stringify(results);
  document.body.append(output);
})();
</script>
</body>
</html>
